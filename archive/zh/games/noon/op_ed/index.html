<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OP & ED · NooN. · Capriccio Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0c;
            background: radial-gradient(circle at center, #1a1a1f 0%, #050505 100%);
            font-family: 'Georgia', 'Times New Roman', 'Noto Serif SC', serif;
            position: relative;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(15, 15, 18, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(150, 130, 100, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 12px;
            color: #c8b88a;
        }

        .back-btn:hover {
            background: rgba(30, 28, 25, 0.85);
            border-color: rgba(200, 170, 120, 0.5);
            transform: scale(1.02);
        }

        .container {
            max-width: 900px;
            width: 90%;
            margin: 0 auto;
            padding: 80px 20px 60px;
        }

        .title {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-zh {
            font-size: 28px;
            color: #d4c5a8;
            letter-spacing: 4px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .title-ja {
            font-size: 14px;
            color: #9a8a6a;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #5a4d3e;
            margin: 20px auto;
        }

        .video-section {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-bottom: 40px;
        }

        .video-card {
            background: rgba(30, 25, 20, 0.4);
            border: 1px solid #5a4d3e;
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            border-color: #c49a6c;
            background: rgba(50, 42, 35, 0.5);
        }

        .video-label-zh {
            font-size: 24px;
            color: #ecd9b4;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-align: center;
        }

        .video-label-ja {
            font-size: 12px;
            color: #9a8a6a;
            text-align: center;
            margin-bottom: 15px;
        }

        .video-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        video {
            width: 100%;
            max-width: 640px;
            background: #000;
            border-radius: 12px;
            border: 1px solid #6a5a48;
            cursor: pointer;
        }

        .video-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: rgba(200, 170, 120, 0.2);
            border: 1px solid #9a8a6a;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 12px;
            color: #c8b88a;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .ctrl-btn:hover {
            background: rgba(200, 170, 120, 0.4);
            border-color: #ecd9b4;
            color: #ecd9b4;
        }

        .progress-container {
            flex: 2;
            min-width: 150px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #3a3228;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #c49a6c;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .time-info {
            font-size: 11px;
            color: #9a8a6a;
            min-width: 100px;
            text-align: center;
        }

        /* 放大视频模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .modal.active {
            display: flex;
        }

        .modal-video {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            border: 2px solid #c49a6c;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #c8b88a;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #ecd9b4;
        }

        footer {
            text-align: center;
            padding: 30px 0 20px;
            font-size: 10px;
            color: #4a4030;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回</a>

    <div class="container">
        <div class="title">
            <div class="title-zh">NooN. OP & ED</div>
            <div class="title-ja">NooN. OP & ED</div>
            <div class="divider"></div>
        </div>

        <div class="video-section">
            <!-- OP -->
            <div class="video-card">
                <div class="video-label-zh">片头曲</div>
                <div class="video-label-ja">OPENING</div>
                <div class="video-container">
                    <video id="opVideo" src="/archive/zh/games/noon/op_ed/video/noon_op.webm" preload="metadata"></video>
                </div>
                <div class="video-controls">
                    <button class="ctrl-btn" id="opPlayBtn">▶ 播放</button>
                    <button class="ctrl-btn" id="opPauseBtn">⏸ 暂停</button>
                    <button class="ctrl-btn" id="opStopBtn">⏹ 停止</button>
                    <button class="ctrl-btn" id="opZoomBtn">🔍 放大</button>
                    <div class="progress-container">
                        <div class="progress-bar" id="opProgressBar">
                            <div class="progress-fill" id="opProgressFill"></div>
                        </div>
                    </div>
                    <div class="time-info" id="opTimeInfo">0:00 / 0:00</div>
                </div>
            </div>

            <!-- ED -->
            <div class="video-card">
                <div class="video-label-zh">片尾曲</div>
                <div class="video-label-ja">ENDING</div>
                <div class="video-container">
                    <video id="edVideo" src="/archive/zh/games/noon/op_ed/video/noon_ed.webm" preload="metadata"></video>
                </div>
                <div class="video-controls">
                    <button class="ctrl-btn" id="edPlayBtn">▶ 播放</button>
                    <button class="ctrl-btn" id="edPauseBtn">⏸ 暂停</button>
                    <button class="ctrl-btn" id="edStopBtn">⏹ 停止</button>
                    <button class="ctrl-btn" id="edZoomBtn">🔍 放大</button>
                    <div class="progress-container">
                        <div class="progress-bar" id="edProgressBar">
                            <div class="progress-fill" id="edProgressFill"></div>
                        </div>
                    </div>
                    <div class="time-info" id="edTimeInfo">0:00 / 0:00</div>
                </div>
            </div>
        </div>
        <footer>Capriccio Suite · NooN. OP & ED</footer>
    </div>

    <!-- 放大视频模态框 -->
    <div id="modal" class="modal">
        <span class="modal-close">&times;</span>
        <video id="modalVideo" class="modal-video" controls></video>
    </div>

    <script>
        // 获取视频元素
        const opVideo = document.getElementById('opVideo');
        const edVideo = document.getElementById('edVideo');

        // OP 相关元素
        const opPlayBtn = document.getElementById('opPlayBtn');
        const opPauseBtn = document.getElementById('opPauseBtn');
        const opStopBtn = document.getElementById('opStopBtn');
        const opZoomBtn = document.getElementById('opZoomBtn');
        const opProgressBar = document.getElementById('opProgressBar');
        const opProgressFill = document.getElementById('opProgressFill');
        const opTimeInfo = document.getElementById('opTimeInfo');

        // ED 相关元素
        const edPlayBtn = document.getElementById('edPlayBtn');
        const edPauseBtn = document.getElementById('edPauseBtn');
        const edStopBtn = document.getElementById('edStopBtn');
        const edZoomBtn = document.getElementById('edZoomBtn');
        const edProgressBar = document.getElementById('edProgressBar');
        const edProgressFill = document.getElementById('edProgressFill');
        const edTimeInfo = document.getElementById('edTimeInfo');

        // 模态框
        const modal = document.getElementById('modal');
        const modalVideo = document.getElementById('modalVideo');
        const modalClose = document.querySelector('.modal-close');

        // ========== OP 控制 ==========
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateOpProgress() {
            if (opVideo.duration) {
                const percent = (opVideo.currentTime / opVideo.duration) * 100;
                opProgressFill.style.width = percent + '%';
                opTimeInfo.innerText = `${formatTime(opVideo.currentTime)} / ${formatTime(opVideo.duration)}`;
            } else {
                opProgressFill.style.width = '0%';
                opTimeInfo.innerText = '0:00 / 0:00';
            }
        }

        function updateEdProgress() {
            if (edVideo.duration) {
                const percent = (edVideo.currentTime / edVideo.duration) * 100;
                edProgressFill.style.width = percent + '%';
                edTimeInfo.innerText = `${formatTime(edVideo.currentTime)} / ${formatTime(edVideo.duration)}`;
            } else {
                edProgressFill.style.width = '0%';
                edTimeInfo.innerText = '0:00 / 0:00';
            }
        }

        // OP 事件监听
        opVideo.addEventListener('timeupdate', updateOpProgress);
        opVideo.addEventListener('loadedmetadata', updateOpProgress);
        
        opPlayBtn.addEventListener('click', () => opVideo.play());
        opPauseBtn.addEventListener('click', () => opVideo.pause());
        opStopBtn.addEventListener('click', () => {
            opVideo.pause();
            opVideo.currentTime = 0;
            updateOpProgress();
        });
        
        opProgressBar.addEventListener('click', (e) => {
            const rect = opProgressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            opVideo.currentTime = percent * opVideo.duration;
            updateOpProgress();
        });

        // ED 事件监听
        edVideo.addEventListener('timeupdate', updateEdProgress);
        edVideo.addEventListener('loadedmetadata', updateEdProgress);
        
        edPlayBtn.addEventListener('click', () => edVideo.play());
        edPauseBtn.addEventListener('click', () => edVideo.pause());
        edStopBtn.addEventListener('click', () => {
            edVideo.pause();
            edVideo.currentTime = 0;
            updateEdProgress();
        });
        
        edProgressBar.addEventListener('click', (e) => {
            const rect = edProgressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            edVideo.currentTime = percent * edVideo.duration;
            updateEdProgress();
        });

        // ========== 放大视频功能 ==========
        function openZoom(videoSrc) {
            modalVideo.pause();
            modalVideo.src = videoSrc;
            modalVideo.load();
            modal.classList.add('active');
            modalVideo.play();
        }

        opZoomBtn.addEventListener('click', () => {
            openZoom('/archive/zh/games/noon/op_ed/video/noon_op.webm');
        });

        edZoomBtn.addEventListener('click', () => {
            openZoom('/archive/zh/games/noon/op_ed/video/noon_ed.webm');
        });

        // 关闭模态框
        modalClose.addEventListener('click', () => {
            modalVideo.pause();
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modalVideo.pause();
                modal.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                modalVideo.pause();
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
