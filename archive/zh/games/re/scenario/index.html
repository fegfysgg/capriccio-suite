<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部分剧情视频 · Re: · Capriccio Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0c;
            background: radial-gradient(circle at center, #1a1a1f 0%, #050505 100%);
            font-family: 'Georgia', 'Times New Roman', 'Noto Serif SC', serif;
            position: relative;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(15, 15, 18, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(150, 130, 100, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 12px;
            color: #c8b88a;
        }

        .back-btn:hover {
            background: rgba(30, 28, 25, 0.85);
            border-color: rgba(200, 170, 120, 0.5);
            transform: scale(1.02);
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            padding: 80px 20px 60px;
        }

        .title {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-zh {
            font-size: 28px;
            color: #d4c5a8;
            letter-spacing: 4px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .title-ja {
            font-size: 14px;
            color: #9a8a6a;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #5a4d3e;
            margin: 20px auto;
        }

        .video-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .video-card {
            background: rgba(30, 25, 20, 0.4);
            border: 1px solid #5a4d3e;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 680px;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            border-color: #c49a6c;
            background: rgba(50, 42, 35, 0.5);
        }

        .video-label-zh {
            font-size: 24px;
            color: #ecd9b4;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-align: center;
        }

        .video-label-ja {
            font-size: 12px;
            color: #9a8a6a;
            text-align: center;
            margin-bottom: 15px;
        }

        .video-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        video {
            width: 100%;
            max-width: 640px;
            background: #000;
            border-radius: 12px;
            border: 1px solid #6a5a48;
            cursor: pointer;
        }

        .video-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: rgba(200, 170, 120, 0.2);
            border: 1px solid #9a8a6a;
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 12px;
            color: #c8b88a;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .ctrl-btn:hover {
            background: rgba(200, 170, 120, 0.4);
            border-color: #ecd9b4;
            color: #ecd9b4;
        }

        .progress-container {
            flex: 2;
            min-width: 150px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #3a3228;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #c49a6c;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .time-info {
            font-size: 11px;
            color: #9a8a6a;
            min-width: 100px;
            text-align: center;
        }

        /* 放大视频模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .modal.active {
            display: flex;
        }

        .modal-video {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            border: 2px solid #c49a6c;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #c8b88a;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #ecd9b4;
        }

        footer {
            text-align: center;
            padding: 30px 0 20px;
            font-size: 10px;
            color: #4a4030;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← 返回</a>

    <div class="container">
        <div class="title">
            <div class="title-zh">Re: 剧情视频</div>
            <div class="title-ja">Re: ストーリー動画</div>
            <div class="divider"></div>
        </div>

        <div class="video-section">
            <div class="video-card">
                <div class="video-label-zh">剧情影像</div>
                <div class="video-label-ja">シナリオ映像</div>
                <div class="video-container">
                    <video id="scenarioVideo" src="/archive/zh/games/re/scenario/re_scenario.webm" preload="metadata"></video>
                </div>
                <div class="video-controls">
                    <button class="ctrl-btn" id="playBtn">▶ 播放</button>
                    <button class="ctrl-btn" id="pauseBtn">⏸ 暂停</button>
                    <button class="ctrl-btn" id="stopBtn">⏹ 停止</button>
                    <button class="ctrl-btn" id="zoomBtn">🔍 放大</button>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                    <div class="time-info" id="timeInfo">0:00 / 0:00</div>
                </div>
            </div>
        </div>
        <footer>Capriccio Suite · Re: 剧情场景</footer>
    </div>

    <!-- 放大视频模态框 -->
    <div id="modal" class="modal">
        <span class="modal-close">&times;</span>
        <video id="modalVideo" class="modal-video" controls></video>
    </div>

    <script>
        const video = document.getElementById('scenarioVideo');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const zoomBtn = document.getElementById('zoomBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const timeInfo = document.getElementById('timeInfo');

        const modal = document.getElementById('modal');
        const modalVideo = document.getElementById('modalVideo');
        const modalClose = document.querySelector('.modal-close');

        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 更新进度条和时间
        function updateProgress() {
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progressFill.style.width = percent + '%';
                timeInfo.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            } else {
                progressFill.style.width = '0%';
                timeInfo.innerText = '0:00 / 0:00';
            }
        }

        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('loadedmetadata', updateProgress);

        // 播放
        playBtn.addEventListener('click', () => {
            video.play();
        });

        // 暂停
        pauseBtn.addEventListener('click', () => {
            video.pause();
        });

        // 停止
        stopBtn.addEventListener('click', () => {
            video.pause();
            video.currentTime = 0;
            updateProgress();
        });

        // 进度条点击跳转
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            video.currentTime = percent * video.duration;
            updateProgress();
        });

        // 放大视频
        zoomBtn.addEventListener('click', () => {
            modalVideo.pause();
            modalVideo.src = '/archive/zh/games/re/scenario/re_scenario.webm';
            modalVideo.load();
            modal.classList.add('active');
            modalVideo.play();
        });

        // 关闭模态框
        modalClose.addEventListener('click', () => {
            modalVideo.pause();
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modalVideo.pause();
                modal.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                modalVideo.pause();
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
